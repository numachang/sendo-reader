name: Sync upstream

on:
  # numachang/fork-sync-cron（Cloudflare の Worker）が、上流が進んだら起動する。
  # schedule は使わない（定刻の実行が作られないことがあり、60日間活動がないと無効にもなるため）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    # この fork の運用設定。上流や、ここから作った別の fork では動かさない。
    if: github.repository == 'numachang/sendo-reader'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync main from upstream
        env:
          GH_TOKEN: ${{ github.token }}
        # Sync fork と同じ API。独自コミットは残し、競合すれば失敗する。
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main
